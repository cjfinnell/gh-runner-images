name: publish
on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  publish:
    name: build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gha-runner-rust, quartz-vault]
    env:
      IMAGE: ghcr.io/cjfinnell/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag
        id: tag
        run: echo "value=$(cat "images/${{ matrix.image }}/TAG")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for existing tag
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.exists.outputs.found != 'true' || github.event_name == 'workflow_dispatch'
      - uses: docker/build-push-action@v7.4.0
        if: steps.exists.outputs.found != 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
